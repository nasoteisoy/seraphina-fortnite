<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Seraphina v7</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc8f2;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas{display:block}
  @keyframes pulse{to{transform:scale(1.08)}}
  #score{position:fixed;left:calc(16px + env(safe-area-inset-left));top:calc(22px + env(safe-area-inset-top));font-size:24px;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
  #juicebar{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;z-index:5}
  #juicebar button{font-size:24px;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.5);cursor:pointer;padding:0}
  #juicebar button.on{background:rgba(255,255,255,.3)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;background:#9cc8f2;z-index:9;flex-direction:column;gap:8px}
  #loading .sp{animation:pulse .5s infinite alternate}
  #keyshelp{position:fixed;left:10px;bottom:10px;background:rgba(0,0,0,.4);padding:6px 10px;border-radius:10px;font-size:12px;line-height:1.5}
  body.is-touch #keyshelp{display:none}
  body:not(.is-touch) #btns{display:none}
  #keyshelp{max-width:calc(100% - 40px);box-sizing:border-box}
  .touch{display:none} body.is-touch .touch{display:block}
  #stick{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5)}
  #knob{position:absolute;left:43px;top:43px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.3)}
  #btns{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,66px);gap:10px}
  #btns .b{width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:32px}
  #btns .b.big{background:rgba(255,255,255,.3)}
  #pips{position:fixed;right:calc(22px + env(safe-area-inset-right));bottom:calc(3px + env(safe-area-inset-bottom));font-size:16px;color:#ffe680;text-shadow:0 0 6px #000;letter-spacing:2px;pointer-events:none}
  #btns .b.on{background:rgba(120,220,255,.45);border-color:#bff}
  #btns .b.dn{transform:scale(.9);background:rgba(255,255,255,.5)}
  body[data-kit=fire] .s, body[data-kit=sera] .f{display:none!important}
  #btns .b .ic{font-size:26px}
  #btns .b.sw{position:relative;font-size:16px;flex-direction:column;line-height:1}
  #btns .b.sw .ar{font-size:15px;opacity:.85}
  #wepbadge{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);font-size:30px;background:rgba(0,0,0,.35);border-radius:22px;padding:2px 14px;border:2px solid rgba(255,255,255,.5)}
</style>
</head>
<body data-kit="sera" data-wep="bow">
<div id="loading"><div class="sp">🏹🗡️</div><div id="loadmsg" style="font-size:14px;opacity:.7"></div></div>
<div id="score">⭐ 0</div>
<div id="juicebar"><button id="calmBtn">⚡</button><button id="muteBtn">🔊</button></div>
<div id="keyshelp">WASD move · Shift run · Space jump · F/click attack · X switch 🏹→🗡️→✊ · B bow · J daggers · U fists · K kick · C/Ctrl crouch · R roll · G dance · V wave · drag camera · M sound · P calm</div>
<div class="touch" id="stick"><div id="knob"></div></div>
<div class="touch" id="btns">
  <div class="b" data-k="KeyR">🤸</div><div class="b" data-k="KeyK">🦶</div><div class="b big" data-k="Space">⬆️</div>
  <div class="b" id="crb" data-k="KeyC">🧎</div><div class="b sw" id="sw" data-k="KeyX"><span class="ic">🗡️</span><span class="ar">🔄</span></div><div class="b big" id="atk" data-k="KeyF">🏹</div><div id="pips"></div>
</div>
